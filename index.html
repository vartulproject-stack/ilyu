<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 420px;
            width: 90%;
            position: relative;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        /* Teddy Bear Styling */
        .teddy-container {
            font-size: 80px;
            margin-bottom: 10px;
            animation: bounceTeddy 2s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes bounceTeddy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .proposal-text {
            color: #333;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .question {
            color: #ff3b6b;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #yesBtn {
            background-color: #ff3b6b;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 59, 107, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #e02d5a;
        }

        #noBtn {
            background-color: #e0e0e0;
            color: #333;
        }

        .hidden {
            display: none !important;
        }

        /* Heart Balloons Animation Style */
        .balloon {
            position: fixed;
            bottom: -100px;
            opacity: 0.9;
            animation: floatUp 6s linear infinite;
            z-index: 1;
        }

        .balloon::before {
            content: "🎈";
            font-size: 45px;
            position: absolute;
        }

        .balloon::after {
            content: "❤️";
            font-size: 18px;
            position: absolute;
            top: 8px;
            left: 13px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(20deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="teddy-container">
            🧸
        </div>

        <p class="proposal-text">
            Yk dear you're my first love and idk how i got feelings for you but now it's very strong and i like you so much !🫠
        </p>

        <p class="question">Will you be mine??? 🌹</p>

        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" onclick="acceptProposal()">YES! 🥰</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">NO 😜</button>
        </div>
    </div>

    <div id="successMsg" class="card hidden">
        <div class="teddy-container">
            🧸❤️
        </div>
        <h1 style="color: #ff3b6b; margin-bottom: 10px;">Yayyy! 🎉❤️</h1>
        <p style="color: #333; font-size: 1.2rem;">I knew you'd say YES! 🥰</p>
    </div>

    <script>
        // NO button jump karega
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        // YES Click hone par: Cracker Burst + Balloons with Heart
        function acceptProposal() {
            document.getElementById('mainCard').classList.add('hidden');
            const success = document.getElementById('successMsg');
            success.classList.remove('hidden');

            // 1. Cracker Burst Effect
            let count = 200;
            let defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });

            // 2. Balloons with Heart floating up
            setInterval(createHeartBalloon, 400);
        }

        function createHeartBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            balloon.style.left = Math.random() * 90 + 'vw';
            balloon.style.animationDuration = Math.random() * 2 + 4 + 's';
            document.body.appendChild(balloon);

            setTimeout(() => {
                balloon.remove();
            }, 6000);
        }
    </script>
</body>
</html>
